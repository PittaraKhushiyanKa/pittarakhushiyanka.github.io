  <style>
    :root {
      --bg: #fffafb;
      --bg-soft: #fdf4f6;
      --card: #ffffff;
      --ink: #14213d;
      --ink-soft: #2e3b55;
      --mut: #525d73;
      --gold: #c9a24b;
      --gold-ink: #825f16;
      --gold-soft: rgba(201, 162, 75, 0.14);
      --pink: #fde4ea;
      --pink-deep: #f8cfd9;
      --line: #f0d9df;
      --navy-top: #10192b;
      --navy-bot: #050b1a;
      --wa: #167940;
      --wa-hover: #116233;
      --red: #c11f30;
      --shadow-sm: 0 2px 10px rgba(20, 33, 61, 0.05);

      --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f1524;
        --bg-soft: #151c30;
        --card: #1a2238;
        --ink: #f5efe6;
        --ink-soft: #dfe5f2;
        --mut: #b0bad0;
        --gold: #e8c779;
        --gold-ink: #f0d592;
        --gold-soft: rgba(232, 199, 121, 0.16);
        --pink: #2a2440;
        --pink-deep: #372f54;
        --line: #2d3654;
        --wa: #1f9d55;
        --wa-hover: #25b864;
        --red: #ff6b78;
        --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.28);
        --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.38);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0f1524;
      --bg-soft: #151c30;
      --card: #1a2238;
      --ink: #f5efe6;
      --ink-soft: #dfe5f2;
      --mut: #b0bad0;
      --gold: #e8c779;
      --gold-ink: #f0d592;
      --gold-soft: rgba(232, 199, 121, 0.16);
      --pink: #2a2440;
      --pink-deep: #372f54;
      --line: #2d3654;
      --wa: #1f9d55;
      --wa-hover: #25b864;
      --red: #ff6b78;
      --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.28);
      --shadow-md: 0 12px 30px rgba(0, 0, 0, 0.38);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(74px + env(safe-area-inset-top, 0px));
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.55 var(--sans);
      min-height: 100dvh;
      overflow-x: clip;
      padding-bottom: calc(82px + env(safe-area-inset-bottom, 0px));
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    @media (min-width: 768px) {
      body { padding-bottom: 0; }
    }

    img { max-width: 100%; height: auto; }

    button, input, select, textarea, a {
      font: inherit;
      color: inherit;
    }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .skip-link {
      position: fixed;
      top: -100px;
      left: 14px;
      z-index: 200;
      background: var(--gold);
      color: #14213d;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      box-shadow: var(--shadow-md);
      transition: top 0.15s ease;
    }
    .skip-link:focus { top: 12px; }

    /* Top Navigation Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(10, 18, 34, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(201, 162, 75, 0.28);
      padding-top: env(safe-area-inset-top, 0px);
      color: #f5efe6;
    }

    .topbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #f5efe6;
      min-width: 0;

    .brand-mini img {
      width: 36px;
      height: 36px;
      border-radius: 8px;

      border: 1px solid rgba(201, 162, 75, 0.45);

    .brand-mini-sub {
      font-size: 11px;
      color: #e8c779;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .desk-nav {
      display: none;
      align-items: center;
      gap: 6px;

    @media (min-width: 768px) {
      .desk-nav { display: flex; }
    }

    .desk-nav button {
      background: transparent;
      border: 1px solid transparent;
      color: #d6dde9;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.18s ease, color 0.18s ease, border-color 0.18s ease;
    }

    .desk-nav button:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
    }

    .desk-nav button[aria-current="page"] {
      background: rgba(201, 162, 75, 0.2);
      border-color: rgba(201, 162, 75, 0.65);
      color: #f6e0a5;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: none;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      min-width: 38px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(201, 162, 75, 0.35);
      background: rgba(255, 255, 255, 0.06);
      color: #f5efe6;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease;
    }

    .icon-btn:hover {
      background: rgba(201, 162, 75, 0.18);
      border-color: rgba(201, 162, 75, 0.7);
    }

    .icon-btn .btn-txt { display: none; }
    @media (min-width: 600px) {
      .icon-btn .btn-txt { display: inline; }
    }

    /* Hero Section */
    .hero {
      background:

        linear-gradient(180deg, var(--navy-top) 0%, var(--navy-bot) 100%);

      padding: 28px 16px 34px;

    .hero-inner {

    .hero-logo-wrap {

      -webkit-mask-composite: source-in;
      mask-image: linear-gradient(transparent, #000 12%, #000 88%, transparent), linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
      mask-composite: intersect;
    }

    @media (min-width: 768px) {
      .hero { padding: 40px 24px 44px; }
      .hero-logo { width: 176px; height: 179px; }
    }

    .hero-title {
      margin: 4px 0 8px;
      font-family: var(--serif);

      line-height: 1.2;
    }

    .gold-rule {
      width: 74px;
      height: 2px;
      margin: 12px auto 14px;
      background: linear-gradient(90deg, transparent, #e8c779, transparent);
    }

    .hero-tagline {
      margin: 0 auto 22px;
      max-width: 580px;
      font-size: clamp(15px, 2.4vw, 17px);
      color: #f3e8d2;
      line-height: 1.55;
    }

    .hero-ctas {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.16s ease, background-color 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
    }

    .btn:active { transform: scale(0.98); }

    .btn-gold {
      background: linear-gradient(135deg, #d8b562, #c1973c);
      color: #14213d;
      box-shadow: 0 6px 18px rgba(201, 162, 75, 0.28);
    }
    .btn-gold:hover { background: linear-gradient(135deg, #e2c272, #cca347); }

    .btn-outline-light {
      background: rgba(255, 255, 255, 0.08);
      color: #f5efe6;
      border: 1px solid rgba(232, 199, 121, 0.55);
    }
    .btn-outline-light:hover { background: rgba(232, 199, 121, 0.18); }

    .btn-wa {
      background: var(--wa);
      color: #ffffff;
    }
    .btn-wa:hover { background: var(--wa-hover); }

    .btn-pink {
      background: var(--pink);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn-pink:hover { background: var(--pink-deep); }

    .btn-ghost {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn-ghost:hover { background: var(--bg-soft); }

    .btn-danger {
      background: transparent;
      color: var(--red);
      border: 1px solid rgba(214, 40, 57, 0.35);
    }
    .btn-danger:hover { background: rgba(214, 40, 57, 0.08); }

    .btn-sm {
      padding: 9px 13px;
      font-size: 13.5px;
      border-radius: 10px;
    }

    .trust-strip {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(232, 199, 121, 0.2);
      font-size: 13px;
      color: #d9dfeb;
    }

    .trust-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .trust-dot { color: #e8c779; }

    /* Main Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 14px 36px;
    }

    @media (min-width: 768px) {
      .container { padding: 28px 24px 48px; }
    }

    /* Draft Banner */
    .draft-banner {
      max-width: 1200px;
      margin: 14px auto 0;
      padding: 0 14px;
    }
    @media (min-width: 768px) {
      .draft-banner { padding: 0 24px; }
    }

    .draft-box {
      background: var(--gold-soft);
      border: 1px solid var(--gold);
      border-radius: var(--radius-md);
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 14px;
    }

    .draft-box.is-warning {
      background: rgba(193, 31, 48, 0.1);
      border-color: var(--red);
    }

    .draft-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Section Headings */
    .sec-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .sec-eyebrow {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--gold-ink);
      margin-bottom: 4px;
    }

    .sec-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(22px, 3.6vw, 30px);
      line-height: 1.25;
      color: var(--ink);
    }

    .sec-sub {
      margin: 4px 0 0;
      color: var(--mut);
      font-size: 14.5px;
    }

    /* Gallery Controls */
    .controls-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 14px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 20px;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .search-wrap {
      position: relative;
      flex: 1 1 240px;
      min-width: 0;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--mut);
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      padding: 11px 38px 11px 40px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--bg);
      color: var(--ink);
      font-size: 15px;
      transition: border-color 0.15s ease;
    }

    .search-input:focus { border-color: var(--gold); }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 0;
      background: var(--pink);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }

    .result-meta {
      font-size: 13.5px;
      color: var(--mut);
      font-weight: 600;
      white-space: nowrap;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
    }

    @media (min-width: 768px) {
      .chips { flex-wrap: wrap; overflow-x: visible; }
    }

    .chip {
      flex: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink-soft);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease;
    }

    .chip:hover {
      border-color: var(--gold);
      background: var(--pink);
    }

    .chip[aria-pressed="true"] {
      background: var(--ink);
      color: #fffaf0;
      border-color: var(--ink);
    }

    :root[data-theme="dark"] .chip[aria-pressed="true"] {
      background: var(--gold);
      color: #14213d;
      border-color: var(--gold);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .chip[aria-pressed="true"] {
        background: var(--gold);
        color: #14213d;
        border-color: var(--gold);
      }
    }

    .chip-cnt {
      font-size: 12px;
      opacity: 0.78;
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (max-width: 350px) {
      .product-grid { grid-template-columns: 1fr; }
    }

    @media (min-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
    }

    @media (min-width: 980px) {
      .product-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
    }

    .p-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }

    .p-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--gold);
    }

    .p-card.highlight {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 162, 75, 0.45), var(--shadow-md);
    }

    .p-media {
      position: relative;
      display: block;
      width: 100%;
      padding: 0;
      border: 0;
      background: var(--bg-soft);
      aspect-ratio: 4 / 5;
      overflow: hidden;
      cursor: zoom-in;
    }

    .p-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .p-media.is-landscape {
      background: radial-gradient(circle at center, var(--card) 0%, var(--bg-soft) 100%);
    }

    .p-media.is-landscape img {
      object-fit: contain;
      padding: 6px;
    }

    .p-card:hover .p-media img { transform: scale(1.03); }

    .p-media-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: linear-gradient(135deg, #10192b, #2a2440);
      color: #f5efe6;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      text-align: center;

      bottom: 8px;

      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      backdrop-filter: blur(4px);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .p-multi-pill {
      position: absolute;
      left: 8px;
      top: 8px;
      background: rgba(10, 18, 34, 0.78);
      color: #f6e0a5;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 8px;

    function validateCatalogBackup(raw) {
      if (!isPlainObject(raw)) {
        return { ok: false, error: "Root JSON must be an object." };
      }

      if (raw.schemaVersion !== undefined) {
        if (typeof raw.schemaVersion !== "string" || raw.schemaVersion !== SUPPORTED_SCHEMA_VERSION) {
          return { ok: false, error: "Unsupported backup schemaVersion (expected \"" + SUPPORTED_SCHEMA_VERSION + "\")." };
        }
      }

      if (!isPlainObject(raw.business)) {
        return { ok: false, error: "Missing or invalid \"business\" section." };
      }
      var biz = raw.business;
      if (typeof biz.name !== "string" || !biz.name.trim() || biz.name.trim().length > 120) {
        return { ok: false, error: "Missing or invalid \"business.name\"." };
      }
      if (typeof biz.tagline !== "string" || biz.tagline.trim().length > 300) {
        return { ok: false, error: "Missing or invalid \"business.tagline\"." };
      }
      var contactTagline = typeof biz.contactTagline === "string" ? biz.contactTagline.trim() : "Follow us and reach us anytime 💬";
      if (contactTagline.length > 200) {
        return { ok: false, error: "\"business.contactTagline\" is too long." };
      }

      if (!isPlainObject(biz.logo)) {
        return { ok: false, error: "Missing or invalid \"business.logo\"." };
      }
      var logoSrc = sanitizeImageSrc(biz.logo.src);
      if (!logoSrc) {
        return { ok: false, error: "\"business.logo.src\" is missing or uses an unsupported/unsafe image format." };
      }
      if (!isPositiveDim(biz.logo.width) || !isPositiveDim(biz.logo.height)) {
        return { ok: false, error: "\"business.logo\" must have valid positive width and height." };
      }
      var logoAlt = typeof biz.logo.alt === "string" ? biz.logo.alt.trim() : biz.name.trim() + " logo";

      if (!isPlainObject(biz.links)) {
        return { ok: false, error: "Missing or invalid \"business.links\"." };
      }
      var links = biz.links;
      var igLink = sanitizeExternalUrl(links.instagram, "instagram");
      if (!igLink) {
        return { ok: false, error: "Missing or invalid \"business.links.instagram\" URL." };
      }
      if (typeof links.instagramHandle !== "string" || !links.instagramHandle.trim() || links.instagramHandle.trim().length > 80) {
        return { ok: false, error: "Missing or invalid \"business.links.instagramHandle\"." };
      }
      var googleBiz = sanitizeExternalUrl(links.googleBusiness, "google");
      if (!googleBiz) {
        return { ok: false, error: "Missing or invalid \"business.links.googleBusiness\" URL." };
      }
      var googleRev = sanitizeExternalUrl(links.googleReview, "google");
      if (!googleRev) {
        return { ok: false, error: "Missing or invalid \"business.links.googleReview\" URL." };
      }
      if (!Array.isArray(links.whatsapp) || !links.whatsapp.length) {
        return { ok: false, error: "\"business.links.whatsapp\" must be a non-empty array." };
      }
      var cleanWa = [];
      var seenWaIds = {};
      for (var wi = 0; wi < links.whatsapp.length; wi++) {
        var w = links.whatsapp[wi];
        if (!isPlainObject(w)) {
          return { ok: false, error: "WhatsApp contact #" + (wi + 1) + " is not a valid object." };
        }
        var wid = typeof w.id === "string" ? w.id.trim() : "";
        var wlabel = typeof w.label === "string" ? w.label.trim() : "";
        var wurl = sanitizeExternalUrl(w.url, "whatsapp");
        if (!wid || seenWaIds[wid] || !/^[A-Za-z0-9_-]{1,40}$/.test(wid)) {
          return { ok: false, error: "WhatsApp contact #" + (wi + 1) + " has a missing, invalid, or duplicate id." };
        }
        if (!wlabel || wlabel.length > 80) {
          return { ok: false, error: "WhatsApp contact #" + (wi + 1) + " has a missing or invalid label." };
        }
        if (!wurl) {
          return { ok: false, error: "WhatsApp contact #" + (wi + 1) + " has an invalid WhatsApp URL." };
        }
        seenWaIds[wid] = true;
        cleanWa.push({ id: wid, label: wlabel, url: wurl });
      }

      var cleanCategories = [];
      if (raw.categories !== undefined) {
        if (!Array.isArray(raw.categories)) {
          return { ok: false, error: "\"categories\" must be an array of strings." };
        }
        for (var ci = 0; ci < raw.categories.length; ci++) {
          var cname = raw.categories[ci];
          if (typeof cname !== "string" || !cname.trim() || cname.trim().length > 80) {
            return { ok: false, error: "Category #" + (ci + 1) + " is invalid." };
          }
          if (cleanCategories.indexOf(cname.trim()) === -1) {
            cleanCategories.push(cname.trim());
          }
        }
      } else {
        cleanCategories = DEFAULT_CATEGORIES.slice();
      }
      if (cleanCategories.indexOf("Uncategorised") === -1) {
        cleanCategories.push("Uncategorised");
      }

      if (!Array.isArray(raw.products)) {
        return { ok: false, error: "Missing or invalid \"products\" array." };
      }
      var cleanProducts = [];
      var seenProductIds = {};
      for (var pi = 0; pi < raw.products.length; pi++) {
        var p = raw.products[pi];
        if (!isPlainObject(p)) {
          return { ok: false, error: "Product #" + (pi + 1) + " is not a valid object." };
        }
        var pid = typeof p.id === "string" ? p.id.trim() : "";
        if (!pid || !/^[A-Za-z0-9_-]{1,80}$/.test(pid)) {
          return { ok: false, error: "Product #" + (pi + 1) + " has a missing or invalid id." };
        }
        if (seenProductIds[pid]) {
          return { ok: false, error: "Duplicate product id detected: \"" + pid + "\"." };
        }
        seenProductIds[pid] = true;

        var pname = typeof p.name === "string" ? p.name.trim() : "";
        if (!pname || pname.length > 200) {
          return { ok: false, error: "Product \"" + pid + "\" has a missing or invalid name." };
        }

        var pcat = "Uncategorised";
        if (p.category !== undefined) {
          if (typeof p.category !== "string" || !p.category.trim() || p.category.trim().length > 80) {
            return { ok: false, error: "Product \"" + pid + "\" has an invalid category." };
          }
          pcat = p.category.trim();
        }

        var pig = "";
        if (p.instagramUrl !== undefined && p.instagramUrl !== "") {
          pig = sanitizeExternalUrl(p.instagramUrl, "instagram");
          if (!pig) {
            return { ok: false, error: "Product \"" + pid + "\" has an invalid instagramUrl." };
          }
        }

        if (!Array.isArray(p.images)) {
          return { ok: false, error: "Product \"" + pid + "\" must include an \"images\" array." };
        }
        var cleanImgs = [];
        for (var ii = 0; ii < p.images.length; ii++) {
          var im = p.images[ii];
          if (!isPlainObject(im)) {
            return { ok: false, error: "Product \"" + pid + "\" image #" + (ii + 1) + " is not a valid object." };
          }
          var isrc = sanitizeImageSrc(im.src);
          if (!isrc) {
            return { ok: false, error: "Product \"" + pid + "\" image #" + (ii + 1) + " has an invalid or unsafe src." };
          }
          var ithumb = isrc;
          if (im.thumb !== undefined && im.thumb !== "") {
            ithumb = sanitizeImageSrc(im.thumb);
            if (!ithumb) {
              return { ok: false, error: "Product \"" + pid + "\" image #" + (ii + 1) + " has an invalid or unsafe thumb." };
            }
          }
          if (im.width !== undefined && !isPositiveDim(im.width)) {
            return { ok: false, error: "Product \"" + pid + "\" image #" + (ii + 1) + " has an invalid width." };
          }
          if (im.height !== undefined && !isPositiveDim(im.height)) {
            return { ok: false, error: "Product \"" + pid + "\" image #" + (ii + 1) + " has an invalid height." };
          }
          if (im.thumbWidth !== undefined && !isPositiveDim(im.thumbWidth)) {
            return { ok: false, error: "Product \"" + pid + "\" image #" + (ii + 1) + " has an invalid thumbWidth." };
          }
          if (im.thumbHeight !== undefined && !isPositiveDim(im.thumbHeight)) {
            return { ok: false, error: "Product \"" + pid + "\" image #" + (ii + 1) + " has an invalid thumbHeight." };
          }
          var ialt = typeof im.alt === "string" ? im.alt.trim().slice(0, 300) : (pname + " — custom gifting creation by " + biz.name.trim());
          var cleanIm = { src: isrc, thumb: ithumb, alt: ialt };
          if (isPositiveDim(im.width)) cleanIm.width = Math.round(im.width);
          if (isPositiveDim(im.height)) cleanIm.height = Math.round(im.height);
          if (isPositiveDim(im.thumbWidth)) cleanIm.thumbWidth = Math.round(im.thumbWidth);
          if (isPositiveDim(im.thumbHeight)) cleanIm.thumbHeight = Math.round(im.thumbHeight);
          cleanImgs.push(cleanIm);
        }

        if (!cleanImgs.length && !pig) {
          return { ok: false, error: "Product \"" + pid + "\" must have at least one valid image or Instagram link." };
        }

        cleanProducts.push({
          id: pid,
          name: pname,
          category: pcat,
          instagramUrl: pig,
          images: cleanImgs
        });
      }

      if (!Array.isArray(raw.reviews)) {
        return { ok: false, error: "Missing or invalid \"reviews\" array." };
      }
      var cleanReviews = [];
      var seenRevIds = {};
      for (var ri = 0; ri < raw.reviews.length; ri++) {
        var r = raw.reviews[ri];
        if (!isPlainObject(r)) {
          return { ok: false, error: "Review #" + (ri + 1) + " is not a valid object." };
        }
        var rid = typeof r.id === "string" ? r.id.trim() : "";
        if (!rid || !/^[A-Za-z0-9_-]{1,80}$/.test(rid) || seenRevIds[rid]) {
          return { ok: false, error: "Review #" + (ri + 1) + " has a missing, invalid, or duplicate id." };
        }
        seenRevIds[rid] = true;

        var rwho = typeof r.who === "string" ? r.who.trim() : "";
        if (!rwho || rwho.length > 100) {
          return { ok: false, error: "Review \"" + rid + "\" has a missing or invalid customer name." };
        }
        var rsrc = typeof r.source === "string" ? r.source.trim() : "";
        if (ALLOWED_REVIEW_SOURCES.indexOf(rsrc) === -1) {
          return { ok: false, error: "Review \"" + rid + "\" has an unsupported source (must be WhatsApp, Instagram, or Google)." };
        }
        var rstars = Number(r.stars);
        if (!isFinite(rstars) || Math.floor(rstars) !== rstars || rstars < 1 || rstars > 5) {
          return { ok: false, error: "Review \"" + rid + "\" must have an integer star rating from 1 to 5." };
        }
        var rtext = r.text === undefined ? "" : (typeof r.text === "string" ? r.text.trim() : null);
        if (rtext === null || rtext.length > 1000) {
          return { ok: false, error: "Review \"" + rid + "\" has invalid review text." };
        }
        var rshot = "";
        if (r.screenshot !== undefined && r.screenshot !== "") {
          rshot = sanitizeImageSrc(r.screenshot);
          if (!rshot) {
            return { ok: false, error: "Review \"" + rid + "\" has an invalid or unsafe screenshot source." };
          }
        }
        if (!rtext && !rshot) {
          return { ok: false, error: "Review \"" + rid + "\" must include text or a valid screenshot." };
        }

        cleanReviews.push({
          id: rid,
          who: rwho,
          source: rsrc,
          stars: rstars,
          text: rtext,
          screenshot: rshot,
          consentConfirmed: Boolean(r.consentConfirmed)
        });
      }

      return {
        ok: true,
        data: {
          schemaVersion: SUPPORTED_SCHEMA_VERSION,
          business: {
            name: biz.name.trim(),
            tagline: biz.tagline.trim(),
            contactTagline: contactTagline,
            logo: {
              src: logoSrc,
              width: Math.round(biz.logo.width),
              height: Math.round(biz.logo.height),
              alt: logoAlt
            },
            links: {
              instagram: igLink,
              instagramHandle: links.instagramHandle.trim(),
              whatsapp: cleanWa,
              googleBusiness: googleBiz,
              googleReview: googleRev
            }
          },
          categories: cleanCategories,
          products: cleanProducts,
          reviews: cleanReviews
        }
      };
    }

    /* Theme Management */
    function applyTheme(pref) {
      var root = document.documentElement;
      if (pref === "dark" || pref === "light") {
        root.setAttribute("data-theme", pref);
      } else {
        root.removeAttribute("data-theme");
      }
      var isDark = pref === "dark" || (!pref && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      $("theme-icon").textContent = isDark ? "☀️" : "🌙";
      $("theme-label").textContent = isDark ? "Light" : "Dark";
      $("theme-toggle").setAttribute("aria-label", isDark ? "Switch to light theme" : "Switch to dark theme");
    }

    function initTheme() {
      var saved = null;
      try { saved = localStorage.getItem(THEME_KEY); } catch (_) {}
      applyTheme(saved);
      $("theme-toggle").addEventListener("click", function () {
        var cur = document.documentElement.getAttribute("data-theme");
        var sysDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var next = cur ? (cur === "dark" ? "light" : "dark") : (sysDark ? "light" : "dark");
        try { localStorage.setItem(THEME_KEY, next); } catch (_) {}
        applyTheme(next);
      });
    }

    /* Local Draft Storage (Accurate Saved-Status Handling) */
    function classifyStorageError(err) {
      if (!err) return "browser storage is unavailable";
      if (err.name === "QuotaExceededError" || err.name === "NS_ERROR_DOM_QUOTA_REACHED" || err.code === 22 || err.code === 1014) {
        return "browser storage quota exceeded";
      }
      if (err.name === "SecurityError") {
        return "browser storage is blocked by privacy settings";
      }
      return "browser storage could not be written";
    }

    function commitDraftData(nextData) {
      var nextChanges = (state.draftChanges || 0) + 1;
      var persisted = false;
      var storageErr = "";
      try {
        var payload = JSON.stringify({
          savedAt: new Date().toISOString(),
          changes: nextChanges,
          data: nextData
        });
        window.localStorage.setItem(DRAFT_KEY, payload);
        persisted = true;
      } catch (err) {
        persisted = false;
        storageErr = classifyStorageError(err);
      }

      /* Atomic swap of in-memory state after persistence attempt */
      state.data = nextData;
      state.hasDraft = true;
      state.draftChanges = nextChanges;
      state.draftPersisted = persisted;
      state.storageError = storageErr;

      return { persisted: persisted, error: storageErr };
    }

    function saveDraft() {
      return commitDraftData(state.data);
    }

    function notifySaveResult(res, savedMsg, sessionActionLabel) {
      if (res && res.persisted) {
        toast(savedMsg);
      } else {
        var reason = (res && res.error) ? res.error : "browser storage unavailable";
        toast((sessionActionLabel || "Updated in this session only") + " — NOT saved to browser storage (" + reason + "). Export products.json now so edits are not lost on refresh.", 5500);
      }
    }

    function loadDraftIfAny() {
      try {
        var raw = window.localStorage.getItem(DRAFT_KEY);
        if (!raw) return false;
        var parsed = JSON.parse(raw);
        if (!isPlainObject(parsed) || !parsed.data) return false;
        var check = validateCatalogBackup(parsed.data);
        if (check.ok) {
          state.data = check.data;
          state.hasDraft = true;
          state.draftPersisted = true;
          state.storageError = "";
          state.draftChanges = (typeof parsed.changes === "number" && parsed.changes > 0) ? Math.floor(parsed.changes) : 1;
          return true;
        }
      } catch (_) {}
      return false;
    }

    function clearDraft() {
      try { window.localStorage.removeItem(DRAFT_KEY); } catch (_) {}
      state.hasDraft = false;
      state.draftPersisted = false;
      state.storageError = "";
      state.draftChanges = 0;
      state.data = clone(state.liveData);
      toast("Local draft discarded. Showing live published catalog.");
      renderAll();
    }

    /* Image Compression for Editor Uploads */
    function compressUploadedImage(file, maxDim) {
      return new Promise(function (resolve, reject) {
        var reader = new FileReader();
        reader.onerror = reject;
        reader.onload = function () {
          var img = new Image();
          img.onerror = reject;
          img.onload = function () {
            var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            var w = Math.max(1, Math.round(img.width * scale));
            var h = Math.max(1, Math.round(img.height * scale));
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            var dataUrl = canvas.toDataURL("image/webp", 0.8);
            var ext = "webp";
            if (!dataUrl || dataUrl.indexOf("data:image/webp") !== 0) {
              dataUrl = canvas.toDataURL("image/jpeg", 0.8);
              ext = "jpg";
            }
            var safeUrl = sanitizeImageSrc(dataUrl);
            if (!safeUrl) {
              reject(new Error("Unsupported image output"));
              return;
            }
            resolve({
              src: safeUrl,
              thumb: safeUrl,
              width: w,
              height: h,
              thumbWidth: w,
              thumbHeight: h,
              isLocalUpload: true,
              suggestedExt: ext
            });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    /* Modal & Confirmation Utilities */
    function restoreFocus() {
      var el = state.lastFocusedEl;
      state.lastFocusedEl = null;
      if (el && typeof el.focus === "function") {
        try { el.focus(); } catch (_) {}
      }

    function openModal(id, triggerEl) {
      state.lastFocusedEl = triggerEl || document.activeElement;
      var el = $(id);
      el.classList.add("open");
      document.body.style.overflow = "hidden";
      var focusable = el.querySelector("button, [href], input, select, textarea");
      if (focusable) setTimeout(function () { focusable.focus(); }, 20);

    function settleConfirm(val) {
      var resolver = state.confirmResolver;
      state.confirmResolver = null;
      $("confirm-yes").onclick = null;
      $("confirm-no").onclick = null;
      $("confirm-close").onclick = null;
      $("confirm-modal").classList.remove("open");
      if (!document.querySelector(".modal-backdrop.open")) {
        document.body.style.overflow = "";
      }
      if (resolver) {
        resolver(Boolean(val));
      }
    }

    function closeAllModals() {
      if (state.confirmResolver) {
        settleConfirm(false);
      }
      ["lightbox-modal", "enquiry-modal", "edit-modal", "confirm-modal"].forEach(function (id) {
        $(id).classList.remove("open");
      });
      document.body.style.overflow = "";
      state.lightbox = null;
      state.enquiry = null;
      state.editingProductId = null;
      restoreFocus();
    }

    function confirmDialog(message, triggerEl) {
      if (state.confirmResolver) {
        settleConfirm(false);
      }
      return new Promise(function (resolve) {
        var settled = false;
        function finish(val) {
          if (settled) return;
          settled = true;
          resolve(Boolean(val));
        }
        state.confirmResolver = finish;
        $("confirm-msg").textContent = message;
        $("confirm-yes").onclick = function () {
          settleConfirm(true);
          restoreFocus();
        };
        $("confirm-no").onclick = function () {
          settleConfirm(false);
          restoreFocus();
        };
        $("confirm-close").onclick = function () {
          settleConfirm(false);
          restoreFocus();
        };
        openModal("confirm-modal", triggerEl);
      });
    }

    /* Export & Download Helpers */
    function triggerDownload(blob, filename) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.style.display = "none";
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    }

    function dataUrlToBlob(dataUrl) {
      var safeUrl = sanitizeImageSrc(dataUrl);
      if (!safeUrl || safeUrl.indexOf("data:image/") !== 0) {
        throw new Error("Invalid data URL");
      }
      var parts = safeUrl.split(",");
      var mime = parts[0].match(/:(.*?);/)[1];
      var bin = atob(parts[1]);
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    function exportProductsJson() {
      var exported = clone(state.data);
      exported.exportedAt = new Date().toISOString();
      if (!state.embedNewPhotosInExport) {
        exported.products.forEach(function (p) {
          (p.images || []).forEach(function (im, idx) {
            if (im.src && im.src.indexOf("data:image/") === 0) {
              var ext = im.src.indexOf("image/webp") !== -1 ? "webp" : (im.src.indexOf("image/png") !== -1 ? "png" : "jpg");
              var suffix = idx === 0 ? "" : ("-" + (idx + 1));
              var path = "assets/products/" + p.id + suffix + "." + ext;
              im.src = path;
              im.thumb = path;
              delete im.isLocalUpload;
              delete im.suggestedExt;
            }
          });
        });
        exported.reviews.forEach(function (r) {
          if (r.screenshot && r.screenshot.indexOf("data:image/") === 0) {
            var ext = r.screenshot.indexOf("image/webp") !== -1 ? "webp" : (r.screenshot.indexOf("image/png") !== -1 ? "png" : "jpg");
            r.screenshot = "assets/products/review-" + r.id + "." + ext;
          }
        });
      }
      var jsonStr = JSON.stringify(exported, null, 2);
      var blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
      triggerDownload(blob, "products.json");
      toast("Downloaded products.json — commit it to GitHub Pages to publish!");
    }

      main.querySelectorAll("[data-rm-rev-shot]").forEach(function (btn) {
        btn.onclick = function () {
          var rev = state.data.reviews.filter(function (r) { return r.id === btn.dataset.rmRevShot; })[0];
          if (rev) {
            rev.screenshot = "";
            var saveRes = saveDraft();
            notifySaveResult(saveRes, "Screenshot removed from local draft.", "Screenshot removed in this session only");
            renderAll();
          }
        };
      });

      /* Content Manager Bindings */
      if (state.managerOpen) {
        renderSafeThumbList($("mgr-p-thumbs"), state.newProductPhotos, function (idx) {
          state.newProductPhotos.splice(idx, 1);
          renderMainOnly();
        }, "New product photo ");

        renderSafeThumbList($("mgr-r-thumbs"), state.newReviewShot ? [state.newReviewShot] : [], function () {
          state.newReviewShot = null;
          renderMainOnly();
        }, "Review screenshot ");

        if ($("mgr-close-btn")) {
          $("mgr-close-btn").onclick = function () { state.managerOpen = false; renderAll(); };
        }
        if ($("mgr-p-files")) {
          $("mgr-p-files").onchange = function (ev) {
            var files = Array.prototype.slice.call(ev.target.files || []);
            ev.target.value = "";
            if (!files.length) return;
            Promise.all(files.map(function (f) { return compressUploadedImage(f, 960); })).then(function (arr) {
              state.newProductPhotos = state.newProductPhotos.concat(arr);
              renderMainOnly();
              toast(arr.length + " photo(s) prepared");
            }).catch(function () { toast("Could not open selected image(s)."); });
          };
        }
        if ($("mgr-add-product-btn")) {
          $("mgr-add-product-btn").onclick = function () {
            var name = $("mgr-p-name").value.trim();
            var cat = $("mgr-p-cat").value || "Uncategorised";
            var ig = $("mgr-p-ig").value.trim();
            if (!name) { toast("Please enter a product name."); return; }
            if (ig && !isValidInstagramUrl(ig)) { toast("Please enter a valid Instagram link."); return; }
            if (!state.newProductPhotos.length && !ig) { toast("Add at least one photo or an Instagram link."); return; }
            var newId = uid();
            var imgs = state.newProductPhotos.map(function (im, idx) {
              im.alt = name + (idx > 0 ? " (view " + (idx + 1) + ")" : "") + " — custom gifting creation by Pittara Khushiyan Ka";
              return im;
            });
            state.data.products.unshift({
              id: newId,
              name: name,
              category: cat,
              instagramUrl: ig,
              images: imgs
            });
            state.newProductPhotos = [];
            var saveRes = saveDraft();
            notifySaveResult(saveRes, "Product added to local draft ✨ Remember to export products.json.", "Product added in this session only");
            renderAll();
          };
        }

        main.querySelectorAll("[data-mgr-rsrc]").forEach(function (b) {
          b.onclick = function () { state.newReviewSource = b.dataset.mgrRsrc; renderMainOnly(); };
        });
        main.querySelectorAll("[data-mgr-star]").forEach(function (b) {
          b.onclick = function () { state.newReviewStars = Number(b.dataset.mgrStar); renderMainOnly(); };
        });
        if ($("mgr-r-file")) {
          $("mgr-r-file").onchange = function (ev) {
            var file = ev.target.files && ev.target.files[0];
            ev.target.value = "";
            if (!file) return;
            compressUploadedImage(file, 800).then(function (imgObj) {
              state.newReviewShot = imgObj;
              renderMainOnly();
              toast("Review screenshot ready");
            }).catch(function () { toast("Could not open screenshot."); });
          };
        }
        if ($("mgr-add-review-btn")) {
          $("mgr-add-review-btn").onclick = function () {
            var who = $("mgr-r-who").value.trim();
            var text = $("mgr-r-text").value.trim();
            var consent = $("mgr-r-consent").checked;
            if (!who) { toast("Enter the customer display name."); return; }
            if (!text && !state.newReviewShot) { toast("Enter review text or upload a screenshot."); return; }
            if (!consent) { toast("Please confirm customer permission & privacy check first."); return; }
            state.data.reviews.unshift({
              id: uid(),
              who: who,
              source: state.newReviewSource,
              stars: state.newReviewStars,
              text: text,
              screenshot: state.newReviewShot ? state.newReviewShot.src : "",
              consentConfirmed: true
            });
            state.newReviewShot = null;
            var saveRes = saveDraft();
            notifySaveResult(saveRes, "Review saved to local draft ⭐ Export products.json to publish.", "Review added in this session only");
            renderAll();
          };
        }

        if ($("mgr-embed-toggle")) {
          $("mgr-embed-toggle").onchange = function (ev) {
            state.embedNewPhotosInExport = ev.target.checked;
            renderMainOnly();
          };
        }

        main.querySelectorAll("[data-dl-asset]").forEach(function (b) {
          b.onclick = function () {
            var idx = Number(b.dataset.dlAsset);
            var list = [];
            state.data.products.forEach(function (p) {
              (p.images || []).forEach(function (im, k) {
                if (im.src && im.src.indexOf("data:image/") === 0) {
                  var ext = im.src.indexOf("image/webp") !== -1 ? "webp" : (im.src.indexOf("image/png") !== -1 ? "png" : "jpg");
                  list.push({ filename: p.id + (k === 0 ? "" : ("-" + (k + 1))) + "." + ext, dataUrl: im.src });
                }
              });
            });
            state.data.reviews.forEach(function (r) {
              if (r.screenshot && r.screenshot.indexOf("data:image/") === 0) {
                var ext = r.screenshot.indexOf("image/webp") !== -1 ? "webp" : (r.screenshot.indexOf("image/png") !== -1 ? "png" : "jpg");
                list.push({ filename: "review-" + r.id + "." + ext, dataUrl: r.screenshot });
              }
            });
            var item = list[idx];
            if (item) {
              try {
                triggerDownload(dataUrlToBlob(item.dataUrl), item.filename);
                toast("Downloaded " + item.filename + " — upload to assets/products/");
              } catch (_) {
                toast("Could not download that image asset.");
              }
            }
          };
        });

        if ($("mgr-export-json")) $("mgr-export-json").onclick = exportProductsJson;
        if ($("mgr-discard-draft")) {
          $("mgr-discard-draft").onclick = function () {
            confirmDialog("Discard all local draft changes and revert to the live published catalog?", $("mgr-discard-draft")).then(function (ok) {
              if (ok) clearDraft();
            });
          };
        }
        if ($("mgr-import-json")) {
          $("mgr-import-json").onchange = function (ev) {
            var file = ev.target.files && ev.target.files[0];
            ev.target.value = "";
            if (!file) return;
            if (file.size > MAX_IMPORT_BYTES) {
              toast("Import rejected: file exceeds the 25 MB safety limit.", 4500);
              return;
            }
            var reader = new FileReader();
            reader.onerror = function () {
              toast("Import failed: could not read the selected file.", 4500);
            };
            reader.onload = function () {
              var parsed;
              try {
                parsed = JSON.parse(reader.result);
              } catch (_) {
                toast("Import rejected: file is not valid JSON. Existing data was not changed.", 4500);
                return;
              }
              var check = validateCatalogBackup(parsed);
              if (!check.ok) {
                toast("Import rejected: " + check.error + " Existing data was not changed.", 5200);
                return;
              }
              /* Atomic restoration: validation passed completely before any state or storage mutation */
              state.newProductPhotos = [];
              state.newReviewShot = null;
              state.editingProductId = null;
              var saveRes = commitDraftData(check.data);
              notifySaveResult(saveRes, "Backup validated and restored into local draft ✨ Export products.json to publish.", "Backup restored in this session only");
              renderAll();
            };
            reader.readAsText(file);
          };
        }
      }
    }

    function updateNavState() {
      document.querySelectorAll("[data-nav]").forEach(function (btn) {
        if (btn.dataset.nav === state.tab) btn.setAttribute("aria-current", "page");
        else btn.removeAttribute("aria-current");
      });
    }

    function renderMainOnly() {
      $("main-content").innerHTML =
        state.tab === "work" ? renderWorkView() :
        state.tab === "reviews" ? renderReviewsView() :
        renderLinksView();
      bindMainEvents();
    }

    function renderAll() {
      updateNavState();
      renderHero();
      renderDraftBanner();
      renderMainOnly();
    }

    /* Hash / Deep Link Support */
    function handleHashRoute() {
      var h = window.location.hash || "";
      var qs = window.location.search || "";
      if (qs.indexOf("manage=1") !== -1 || h === "#manage") {
        state.managerOpen = true;
      }
      if (h === "#reviews") {
        state.tab = "reviews";
      } else if (h === "#links" || h === "#contact") {
        state.tab = "links";
      } else if (h.indexOf("#product-") === 0) {
        state.tab = "work";
        state.search = "";
        state.category = "all";
        var targetId = decodeURIComponent(h.slice("#product-".length));
        setTimeout(function () {
          var card = document.getElementById("product-" + targetId);
          if (card) {
            card.scrollIntoView({ behavior: "smooth", block: "center" });
            card.classList.add("highlight");
            setTimeout(function () { card.classList.remove("highlight"); }, 2800);
          }
        }, 120);
      }
    }

    /* Global Listeners */
    function bindGlobalEvents() {
      document.querySelectorAll("[data-nav]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          state.tab = btn.dataset.nav;
          renderAll();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });

      $("brand-home-link").addEventListener("click", function (ev) {
        ev.preventDefault();
        state.tab = "work";
        renderAll();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });

      $("open-manager-btn").addEventListener("click", function () {
        state.managerOpen = !state.managerOpen;
        renderAll();
        var mgr = $("content-manager");
        if (mgr) mgr.scrollIntoView({ behavior: "smooth", block: "start" });
      });

      ["lightbox-modal", "enquiry-modal", "edit-modal", "confirm-modal"].forEach(function (id) {
        $(id).addEventListener("click", function (ev) {
          if (ev.target === $(id)) closeAllModals();
        });
      });

      document.addEventListener("keydown", function (ev) {
        if (ev.key === "Escape") {
          if (document.querySelector(".modal-backdrop.open")) closeAllModals();
        } else if (state.lightbox && state.lightbox.type === "product" && state.lightbox.product.images.length > 1) {
          var len = state.lightbox.product.images.length;
          if (ev.key === "ArrowLeft") {
            state.lightbox.index = (state.lightbox.index - 1 + len) % len;
            renderLightboxContent();
          } else if (ev.key === "ArrowRight") {
            state.lightbox.index = (state.lightbox.index + 1) % len;
            renderLightboxContent();
          }
        }
      });

      window.addEventListener("hashchange", function () {
        handleHashRoute();
        renderAll();
      });
    }

    /* Bootstrap */
    function init() {
      initTheme();
      bindGlobalEvents();

      var fallbackEl = $("fallback-data");
      var fallbackParsed = null;
      try {
        fallbackParsed = fallbackEl ? JSON.parse(fallbackEl.textContent) : null;
      } catch (_) {}

      function startWith(rawData) {
        var check = validateCatalogBackup(rawData);
        if (!check.ok) {
          if (fallbackParsed && rawData !== fallbackParsed) {
            var fbCheck = validateCatalogBackup(fallbackParsed);
            if (fbCheck.ok) {
              state.liveData = fbCheck.data;
              state.data = clone(state.liveData);
              loadDraftIfAny();
              handleHashRoute();
              renderAll();
              return;
            }
          }
          $("main-content").innerHTML = '<div class="empty-state"><h3>Catalog data error</h3><p>Could not validate <code>products.json</code>.</p></div>';
          return;
        }
        state.liveData = check.data;
        state.data = clone(state.liveData);
        loadDraftIfAny();
        handleHashRoute();
        renderAll();
      }

      fetch("./products.json", { cache: "no-cache" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (json) { startWith(json); })
        .catch(function () {
          if (fallbackParsed) startWith(fallbackParsed);
          else {
            $("main-content").innerHTML = '<div class="empty-state"><h3>Could not load catalog</h3><p>Please check that <code>products.json</code> is present alongside <code>index.html</code>.</p></div>';
          }
        });
    }

    init();
  })();
  </script>
</body>
</html>
