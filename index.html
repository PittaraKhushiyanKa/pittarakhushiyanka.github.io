main{max-width:560px;margin:0 auto;padding:14px}
#bar{max-width:560px;margin:10px auto 0;padding:0 14px}#bar button{margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tag{text-align:center;font-weight:600;background:var(--pink)}
input{width:100%;font:inherit;padding:13px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin:4px 0 10px}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 16px;background:var(--gold);color:#14213d;width:100%;cursor:pointer;margin-top:4px}
button.alt{background:var(--pink);color:var(--ink)}button.del{background:transparent;color:var(--red);width:auto;padding:6px 8px;font-size:15px}
.lbl{color:var(--mut);font-size:15px;margin:4px 0}.empty{color:var(--mut);text-align:center;padding:14px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px}.gi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px}
.gi img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;margin-bottom:6px}
.shot{width:100%;max-height:260px;object-fit:contain;margin-top:8px;border-radius:10px}.gold{color:var(--gold);font-size:22px;letter-spacing:2px}
.bd{float:right;color:#fff;font-size:13px;font-weight:700;border-radius:20px;padding:3px 10px}
.chips{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.chips button{width:auto;padding:8px 14px;font-size:15px;background:var(--pink);color:var(--ink);opacity:.75}.chips button.on{background:var(--gold);color:#14213d;opacity:1}
.stars{display:flex}.stars button{width:auto;padding:2px 8px;font-size:30px;background:none;color:var(--mut)}.stars button.on{color:var(--gold)}
a.lk{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px}
a.lk small{color:var(--mut)}.ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mut);font-size:12px;padding:6px 2px;border-radius:10px;margin:0}nav button.on{color:var(--ink);background:var(--pink)}
.ov{display:none;position:fixed;inset:0;background:#000c;align-items:center;justify-content:center;padding:16px;z-index:50}.ov .card{width:100%;max-width:380px;margin:0}.ov img{max-width:100%;max-height:90vh;border-radius:12px}
#tt{display:none;position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));background:#14213d;color:#fff;border:2px solid #c9a24b;border-radius:14px;padding:12px;text-align:center;z-index:80}

  if(d.we){wedit=d.we;render();return}

  if(d.pk=="w"){wp.splice(+d.pi,1);drawP();return}if(d.pk=="r"){rp=null;drawP();return}

  if(t.id=="w-add"){var n=$("w-name").value.trim(),ig=$("w-ig").value.trim();if(!n){toast("Enter a product name");return}

    if(!wp.length&&!ig){toast("Choose a photo or paste an Instagram link");return}
    var arr=wp.length?wp:[""];arr.forEach(function(x,k){D.w.unshift({id:uid()+k,name:arr.length>1?n+" "+(k+1):n,img:x,ig:ig})});dirty+=arr.length;wp=[];toast("Added ✨ Remember to publish");render();return}
  if(t.id=="r-add"){var w=$("r-name").value.trim(),x=$("r-text").value.trim();if(!w){toast("Enter the customer name");return}if(!x&&!rp){toast("Add what they said or a screenshot");return}
